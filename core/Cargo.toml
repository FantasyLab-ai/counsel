[package]
name = "aurora-core"
version = "0.1.0"
edition = "2021"
description = "Aurora's mobile-relevant analysis methods, ported to Rust with golden-test parity against the Python engine. One numerical source of truth, everywhere."
license = "MIT"

[lib]
# rlib for Rust consumers; cdylib + staticlib so uniffi can bind
# Swift (iOS) and Kotlin (Android) in the next milestone.
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
# The math core is pure-std by design: no runtime deps means trivial
# cross-compilation and no supply-chain surface. uniffi appears ONLY behind
# the `ffi` feature, used to build the mobile (Swift/Kotlin) bindings.
uniffi = { version = "0.29", optional = true, features = ["cli"] }

[features]
ffi = ["dep:uniffi"]

[[bin]]
name = "uniffi-bindgen"
required-features = ["ffi"]

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
