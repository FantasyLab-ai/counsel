<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Counsel — founding member cards (print, two-sided)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Two-sided, 10 cards per US Letter sheet (2 x 5 of 3.5in x 2in).
     Page 1 = fronts, page 2 = backs (columns MIRRORED so a long-edge
     duplex print lines up). Print from Chrome/Edge: Ctrl+P -> More
     settings -> Background graphics ON, scale 100%, Letter, two-sided
     "flip on long edge" (or print page 1, re-feed, print page 2). */
  * { margin: 0; padding: 0; box-sizing: border-box;
      -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  html, body { background: #fff; }
  .sheet {
    width: 8.5in; height: 11in; margin: 0 auto;
    display: grid; grid-template-columns: repeat(2, 3.5in);
    grid-auto-rows: 2in; gap: 0.18in; justify-content: center;
    align-content: center;
  }
  .sheet.backs { direction: rtl; }        /* mirror columns for duplex */
  .sheet.backs .card { direction: ltr; }
  @media print {
    @page { size: letter portrait; margin: 0.25in; }
    .hint { display: none; }
    .pagebreak { break-before: page; }
  }
  .hint { font: 13px/1.6 Inter, sans-serif; color: #444; max-width: 7.5in;
          margin: 14px auto; }
  .card {
    width: 3.5in; height: 2in; background: #0f1511; border-radius: 10px;
    position: relative; overflow: hidden; color: #ecf1e8;
    display: flex; padding: 0.16in;
    outline: 1px dashed #bbb; outline-offset: 2px;
  }
  .card::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0;
    width: 5px; background: linear-gradient(180deg, #c9f36a, #5ab8ff);
  }
  .left { flex: 1; display: flex; flex-direction: column; padding-left: 0.1in; }
  .word { font-family: Fraunces, serif; font-weight: 500; font-size: 17px; }
  .word span { font-family: "JetBrains Mono", monospace; font-size: 7px;
               letter-spacing: 0.22em; text-transform: uppercase;
               color: #93a095; margin-left: 6px; }
  .tag { font-family: Fraunces, serif; font-style: italic; font-size: 11.5px;
         color: #cdae7e; margin-top: 3px; }
  .steps { margin-top: auto; font: 8.5px/1.65 Inter, sans-serif; color: #bcc8bd; }
  .steps b { color: #ecf1e8; font-weight: 600; }
  .steps .n { color: #c9f36a; font-family: "JetBrains Mono", monospace; }
  .code { margin-top: 5px; font-family: "JetBrains Mono", monospace;
          font-size: 8px; letter-spacing: 0.06em; color: #93a095; }
  .code .line { display: inline-block; width: 1.25in;
                border-bottom: 1px solid #3a453c; height: 11px; }
  .contact { margin-top: 4px; font-family: "JetBrains Mono", monospace;
             font-size: 7px; line-height: 1.5; color: #75827a; letter-spacing: 0.04em; }
  .qrwrap { width: 1.18in; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 4px; }
  .qr { width: 1.06in; height: 1.06in; background: #fff; border-radius: 8px;
        display: grid; place-items: center; padding: 0.04in; }
  .qr img { width: 100%; height: 100%; display: block; }
  .qr .placeholder { font: 8px/1.4 Inter, sans-serif; color: #999;
                     text-align: center; }
  .qrlabel { font-family: "JetBrains Mono", monospace; font-size: 6.5px;
             letter-spacing: 0.14em; text-transform: uppercase; color: #93a095; }
  /* back-side specifics */
  .roles { font-family: Fraunces, serif; font-size: 10.5px; line-height: 1.5;
           color: #ecf1e8; }
  .roles em { font-style: italic; color: #cdae7e; }
  .desc { font: 8px/1.55 Inter, sans-serif; color: #bcc8bd; margin-top: 6px; }
  .desc b { color: #ecf1e8; }
  .math { margin-top: auto; font-family: Fraunces, serif; font-style: italic;
          font-size: 9.5px; color: #c9f36a; }
</style>
</head>

  re-feed the stack, print page 2.) Backs are column-mirrored so they align.
  Cardstock if available; FedEx Office cuts the stack for ~$2.
</p>
