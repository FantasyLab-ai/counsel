<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1511" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- iOS home-screen install. Older iOS ignores the manifest's display mode
         and needs these tags; newer iOS honours both. Status bar is "default"
         because the app is now dark-first; white status text sits on the
         dark surface correctly. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Counsel" />
    <meta name="description" content="Counsel — the honest AI CFO for your business. Powered by Aurora." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Counsel — your honest AI CFO</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // screenshot rig: ?ss_v=1&ss_p=<persona> seeds device state pre-render
      try {
        var q = new URLSearchParams(location.search);
        if (q.get("ss_v")) localStorage.setItem("counsel.visited", "1");
        if (q.get("ss_p")) localStorage.setItem("counsel.persona", q.get("ss_p"));
        if (q.get("ss_c")) localStorage.setItem("counsel.coach.today", "1");
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
