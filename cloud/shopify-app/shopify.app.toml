# Counsel — Shopify app configuration (config-as-code for the new dev dashboard).
# Deploy a new version with:   npx @shopify/cli@latest app deploy
# (run from this directory; it will prompt you to log in and pick the org)
#
# What this version changes vs the one released 2026-07-16:
#   * embedded = false  — Counsel is a STANDALONE app (merchants use it at
#     counsel-demo.pages.dev, not inside the Shopify admin), and standalone
#     apps use the authorization-code OAuth flow our worker implements.
#   * [auth] redirect_urls — the allowlist for our OAuth callback; without
#     this Shopify rejects the sign-in redirect.
#   * [access_scopes] — read-only: orders + products. Counsel never writes.

client_id = "a2448137f1eaae2812da54bebd40540f"
name = "Counsel"
application_url = "https://counsel-demo.pages.dev/power"
embedded = false

[access_scopes]
scopes = "read_orders,read_products"

[auth]
redirect_urls = [
  "https://counsel-cloud.fantasy-labai.workers.dev/v1/oauth/shopify/callback",
]

[webhooks]
api_version = "2026-07"
